<div class="card">
  <div class="btn-group d-inline-block p-4 border-bottom" role="group">
    <button type="button" class="btn btn-lg btn-beige" (click)="navigateToManage()">Manage</button>
    <button type="button" class="btn btn-lg btn-light active-tab">Structure</button>
    <button type="button" class="btn btn-lg btn-beige" (click)="navigateToConditions()">
      Condition
    </button>
  </div>
  <div class="card-body p-4">
    <div class="row align-items-center mb-4">
      <div class="col">
        <h1 class="module-title mb-0">Template Structure</h1>
      </div>
    </div>
    <div class="row align-items-top mb-4">
      <div class="col-12 col-md-4 col-xl-4 col-xxl-4">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Select a module</mat-label>
          <mat-select [(value)]="moduleNameSelected" (selectionChange)="refreshProducts()">
            <mat-option value="" disabled>Select a module</mat-option>
            <mat-option *ngFor="let module of modules" [value]="module">{{ module }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-12 col-md-4 col-xl-3 col-xxl-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Select a product</mat-label>
          <mat-select [(value)]="productNameSelected" (selectionChange)="refreshTemplates()">
            <mat-option value="" disabled>Select a product</mat-option>
            <mat-option *ngFor="let product of products" [value]="product">{{
              product
            }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-11 col-md-1 col-xl-3 col-xxl-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Select a template</mat-label>
          <mat-select [(value)]="templateNameSelected" (selectionChange)="openEditor()">
            <mat-option value="" disabled>Select a template</mat-option>
            <mat-option *ngFor="let template of templates" [value]="template">{{
              template
            }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-1 col-xl-2">
        <button mat-icon-button><mat-icon (click)="refreshModules()">refresh</mat-icon></button>
      </div>
    </div>
    @if (templateNameSelected === '') {
      <div class="row justify-content-center align-items-center" style="height: 220px">
        <div class="col-12 d-flex flex-column align-items-center justify-content-center">
          <mat-icon style="height: 50px; width: 50px; font-size: 48px; color: #bdbdbd"
            >share</mat-icon
          >
          <h3 class="mt-3 mb-1 text-secondary">No template selected</h3>
          <div class="text-muted">Please select a template to show its structure</div>
        </div>
      </div>
    }
    <ng-template #dynamicEditorLoader></ng-template>
  </div>
</div>
